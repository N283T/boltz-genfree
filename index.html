<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boltz-GenFree</title>
<meta name="description" content="Boltz-GenFree: project page, coming soon.">
<style>
:root{--bg:#fafaf7;--ink:#161616;--ink-2:#565656;--accent:#b8124f;--line:#bdbdb8}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--ink:#fafaf7;--ink-2:#bdbdb8;--accent:#f7a8c8;--line:#565656}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 "Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{max-width:560px;border-left:6px solid var(--accent);padding:4px 0 4px 22px}
h1{margin:0 0 8px;font:800 clamp(34px,7vw,52px)/1.05 "Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em}
p{margin:0 0 14px;color:var(--ink-2)}
a{color:var(--accent);font-weight:700}
.tag{display:inline-block;margin-bottom:14px;padding:4px 8px;border:2px solid var(--ink);font:700 13px/1 ui-monospace,Menlo,monospace;letter-spacing:.07em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <span class="tag">Coming soon</span>
  <h1>Boltz-GenFree</h1>
  <p>The project page is in preparation.</p>
  <p><a href="https://github.com/N283T/boltz-genfree">Code on GitHub</a></p>
</main>
</body>
</html>
