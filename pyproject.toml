[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "boltz-stfree"
version = "0.1.0"
requires-python = ">=3.10"
description = "Structure-free Boltz-2 affinity screening"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jeremy Wohlwend" },
    { name = "Gabriele Corso" },
    { name = "Saro Passaro" },
]
maintainers = [
    { name = "N283T" },
]
keywords = [
    "protein-structure-prediction",
    "molecular-modeling",
    "alphafold",
    "biology",
    "drug-discovery",
    "virtual-screening",
    "binding-affinity",
    "structure-free",
    "deep-learning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pytorch-lightning>=2.5.0",
    "rdkit>=2024.3.2",
    "requests>=2.32.3",
    "pandas>=2.2.2",
    "types-requests",
    "einops>=0.8.0",
    "mashumaro>=3.14",
    "click>=8.1.7",
    "pyyaml>=6.0.2",
    "biopython>=1.84",
    "scipy>=1.13.1",
    "numba>=0.61.0",
    "gemmi>=0.6.5",
    "scikit-learn>=1.6.1",
    "chembl_structure_pipeline>=1.2.2",
    "omegaconf>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/N283T/boltz-stfree"
Source = "https://github.com/N283T/boltz-stfree"
Issues = "https://github.com/N283T/boltz-stfree/issues"
Changelog = "https://github.com/N283T/boltz-stfree/releases"
Research-Runtime = "https://github.com/N283T/boltz2-affinity-interventions-boltz"
Community-Upstream = "https://github.com/Novel-Therapeutics/boltz-community"
Upstream = "https://github.com/jwohlwend/boltz"

[project.scripts]
boltz-stfree = "boltz.main:cli"
boltz-stfree-fix-macos-libomp = "boltz.scripts.fix_macos_libomp:main"

[project.optional-dependencies]
lint = ["ruff"]
test = ["pytest", "requests"]
cuda = [
    "cuequivariance_ops_cu13>=0.5.0",
    "cuequivariance_ops_torch_cu13>=0.5.0",
    "cuequivariance_torch>=0.5.0",
]
cuda12 = [
    "cuequivariance_ops_cu12>=0.5.0",
    "cuequivariance_ops_torch_cu12>=0.5.0",
    "cuequivariance_torch>=0.5.0",
]

[tool.ruff]
src = ["src"]
extend-exclude = ["conf.py"]
target-version = "py39"
lint.select = ["ALL"]
lint.ignore = [
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "ANN101",  # "missing-type-self"
    "RET504",  # Unnecessary assignment to `x` before `return` statementRuff
    "S101",    # Use of `assert` detected
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "PT001",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT004",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT005",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT023",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "FBT001",
    "FBT002",
    "PLR0913", # Too many arguments to init (> 5)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Imported but unused
    "F403", # Wildcard imports
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`(https://github.com/astral-sh/ruff/issues/5434)
keep-runtime-typing = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
