<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boltz-GenFree WebGPU</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: .6rem 0 .2rem; }
  input, textarea, select, button { font: inherit; width: 100%; box-sizing: border-box; padding: .3rem; }
  textarea { font-family: ui-monospace, monospace; font-size: 13px; }
  pre { background: #f3f3f3; padding: .8rem; overflow: auto; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } pre { background: #222; } input, textarea, select { background: #222; color: #eee; } }
</style>
</head>
<body>
<h1>Boltz-GenFree on WebGPU</h1>
<p>Protein sequence (+ optional A3M) and a ligand SMILES go through featurisation, the Boltz-2 trunk
(LocalFold's WebGPU port) and the structure-free affinity module, all in this page. Serve it with
<code>LOCALFOLD_DIR=... node tools/serve.js</code> (see <code>docs/webgpu.md</code>).</p>
<label for="seq">Protein sequence (receptor chain)</label>
<textarea id="seq" rows="3">QLEDSEVEAVAKGLEEMYANGVTEDNFKNYVKNNFAQQEISSVEEELNVNISDSCVANKIKDEFFAMISISAIVKAAQKKAWKELAVTVLRFAKANGLKTNAIIVAGQLALWAVQCG</textarea>
<label for="a3m">A3M (optional; first row = the query)</label>
<textarea id="a3m" rows="3" placeholder=">query&#10;SEQUENCE&#10;&gt;hit&#10;..."></textarea>
<label for="smiles">Ligand SMILES</label>
<input id="smiles" value="Oc1ccccc1">
<label for="weights">Trunk weights (manifest directory URL)</label>
<input id="weights" value="/packs/boltz2-trunk-f32/">
<label for="precision">Trunk precision</label>
<select id="precision"><option value="f32">f32 (parity)</option><option value="auto">auto (f16 where available)</option></select>
<p><button id="run">Score</button></p>
<pre id="out">idle</pre>
<script type="module">
import { TensorBundle } from "../src/bundle.js";
import { createChain } from "../src/trunk/chain.js";

const out = document.getElementById("out");
let chain;
document.getElementById("run").addEventListener("click", async () => {
  try {
    if (!navigator.gpu) throw new Error("this browser has no WebGPU");
    const origin = location.origin;
    if (!chain) {
      out.textContent = "loading weights...";
      const adapter = await navigator.gpu.requestAdapter();
      chain = await createChain({
        localfold: `${origin}/localfold/`,
        trunkWeights: new URL(document.getElementById("weights").value, location.href).href,
        affinityPack: await TensorBundle.fromUrl("../packs/genfree-affinity.json"),
        adapter, onStatus: (s) => { out.textContent = s; },
      });
    }
    out.textContent = "running...";
    const r = await chain.score({
      sequence: document.getElementById("seq").value.replace(/\s+/g, ""),
      a3m: document.getElementById("a3m").value.trim() || null,
      smiles: document.getElementById("smiles").value.trim(),
    }, { precision: document.getElementById("precision").value });
    out.textContent = JSON.stringify({
      affinity_pred_value: r.value, affinity_probability_binary: r.probability,
      tokens: r.tokens, receptor_tokens: r.receptorTokens, ligand_tokens: r.ligandTokens, msa_rows: r.msaRows,
      members: r.members.map((m) => ({ value: m.value, probability: m.probability })),
      timings_ms: Object.fromEntries(Object.entries(r.timings).map(([k, v]) => [k, Math.round(v)])),
      weight_load_ms: Math.round(chain.weightLoadMs), notes: r.notes,
    }, null, 2);
  } catch (error) {
    out.textContent = String(error?.stack ?? error);
  }
});
</script>
</body>
</html>
