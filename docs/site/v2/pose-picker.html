<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose picker</title>
<style>
:root{--bg:#fafaf7;--ink:#161616;--ink-2:#565656;--line:#bdbdb8;--soft:#f1f1ee;--accent:#b8124f;--mono:ui-monospace,Menlo,monospace;--sans:"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans)}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px}
h1{margin:0 0 6px;font:800 24px/1.2 var(--sans)}
p{margin:0 0 14px;color:var(--ink-2)}
#v{position:relative;width:100%;max-width:740px;aspect-ratio:1/1;background:var(--soft);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
button{font:700 15px/1 var(--sans);padding:11px 14px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
button.pri{background:var(--ink);color:#fff}
textarea{width:100%;max-width:740px;height:92px;font:500 13px/1.4 var(--mono);border:1px solid var(--line);padding:8px;background:#fff}
#msg{font:600 14px/1 var(--sans);color:var(--accent);align-self:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pose picker</h1>
  <p>Drag to rotate, scroll to zoom. Both panels of the figure open with the view you leave here.
     Press <b>Copy view</b> and paste the text to Claude.</p>
  <div id="v"></div>
  <div class="row">
    <button class="pri" id="copy">Copy view</button>
    <button id="reset">Reset to the page default</button>
    <span id="msg"></span>
  </div>
  <textarea id="out" readonly aria-label="current view"></textarea>
</div>

<script>
(function(){
  var KEPT=[[1,13],[40,50],[53,150],[160,209],[211,228]];
  var v=$3Dmol.createViewer(document.getElementById('v'),{backgroundAlpha:0});
  v.addModel(document.getElementById('pdb').textContent,'pdb');
  v.setStyle({chain:'A'},{cartoon:{color:0xb4b4ae}});
  v.setStyle({chain:'A',resi:KEPT.map(function(r){return r[0]+'-'+r[1];})},{cartoon:{color:0x2a7bbf}});
  v.setStyle({chain:'B'},{stick:{colorscheme:{prop:'elem',map:{C:0xb8124f,N:0x161616,O:0x161616,S:0x161616}},radius:0.36}});
  function cen(m,sel){var a=m.selectedAtoms(sel),c=[0,0,0];a.forEach(function(t){c[0]+=t.x;c[1]+=t.y;c[2]+=t.z;});return c.map(function(x){return x/a.length;});}
  function home(){
    var m=v.getModel(),r=cen(m,{chain:'A'}),l=cen(m,{chain:'B'});
    var u=[l[0]-r[0],l[1]-r[1],l[2]-r[2]],n=Math.hypot(u[0],u[1],u[2]);u=u.map(function(x){return x/n;});
    var ax=[u[1],-u[0],0],s=Math.hypot(ax[0],ax[1]),th=Math.acos(Math.max(-1,Math.min(1,u[2]))),h=Math.sin(th/2)/(s||1);
    v.zoomTo();var view=v.getView();
    view[4]=-ax[0]*h;view[5]=-ax[1]*h;view[6]=0;view[7]=Math.cos(th/2);
    v.setView(view);v.rotate(90,'y');v.render();
  }
  var out=document.getElementById('out'),msg=document.getElementById('msg');
  function show(){out.value=JSON.stringify(v.getView().map(function(x){return Math.round(x*1e5)/1e5;}));}
  home();show();
  v.setViewChangeCallback(show);
  document.getElementById('reset').onclick=function(){home();show();};
  document.getElementById('copy').onclick=function(){
    out.select();
    var done=function(){msg.textContent='Copied';setTimeout(function(){msg.textContent='';},1500);};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out.value).then(done,function(){document.execCommand('copy');done();});}
    else{document.execCommand('copy');done();}
  };
})();
</script>
