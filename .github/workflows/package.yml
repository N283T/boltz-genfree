name: Build package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Locked package build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked build environment
        run: uv sync --frozen --extra package

      - name: Build and validate artifacts
        run: |
          uv build --no-build-isolation
          uv run --frozen --extra package twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

# Publishing is intentionally absent. Add a separately reviewed release
# workflow only after the boltz-genfree PyPI project and Trusted Publisher are
# configured for N283T/boltz-genfree.
