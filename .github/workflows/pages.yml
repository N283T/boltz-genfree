name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/*.md"
      - "docs/guide/**"
      - "README.md"
      - "webgpu/src/**"
      - "webgpu/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the project site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # The browser tool reads the GenFree affinity pack (35 MB) from the site itself. The pack is not in the repository; it is a
      # release asset (see webgpu/README or docs/webgpu.md). Until that release exists the site is still published, without the pack.
      - name: Fetch the affinity pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p webgpu/packs
          gh release download webgpu-weights-1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'genfree-affinity.*' --dir webgpu/packs --clobber \
            || echo "::warning::release webgpu-weights-1 not found; the browser tool will not run on this deployment"

      # Pages, the Docs and the browser tool are assembled by one script, the same one used for local preview.
      # docs/site/internal holds working tools and is never published.
      - name: Assemble site
        run: docs/site/assemble.sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
