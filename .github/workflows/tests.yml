name: CPU Tests

on:
  # During the experimental phase, run this manually on the exact branch or
  # commit intended for publication instead of consuming Actions on every PR.
  workflow_dispatch:

jobs:
  cpu-tests:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run CPU tests
        run: pytest -v --tb=short
